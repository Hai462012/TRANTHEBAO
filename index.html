<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang cá nhân</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #020617;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
    }

    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid cyan;
    }

    h2 {
      margin: 15px 0 5px;
    }

    .birth {
      color: #38bdf8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="ban.jpg" alt="Ảnh bạn">
    <h2>Tên Bạn Mày</h2>
    <div class="birth">🎂 Sinh ngày: 01 / 01 / 2008</div>
  </div>
</body>
</html>
